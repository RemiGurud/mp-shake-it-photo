name: Build ShakeItPhoto IPA

on:
  workflow_dispatch:

  jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

         - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

          - name: Install Pods
        run: pod install --repo-update

      - name: Show schemes
        run: |
          xcodebuild \
            -workspace ShakeItPhoto.xcworkspace \
            -list

            - name: Create Firebase config
        run: |
          cat > GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>API_KEY</key>
            <string>dummy</string>
            <key>PROJECT_ID</key>
            <string>dummy-project</string>
          </dict>
          </plist>
          EOF

          - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ShakeItPhoto.xcworkspace \
            -scheme ShakeItPhoto \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

            - name: Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -type d -name "ShakeItPhoto.app" | head -1)
          echo "Application found at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r ShakeItPhoto.ipa Payload

          - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShakeItPhoto-IPA
          path: ShakeItPhoto.ipa
